[package]
name = "docs-proof"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Wyatt Au <wyatt_au@protonmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/docs-proof"
homepage = "https://github.com/WyattAu/docs-proof"
documentation = "https://docs.rs/docs-proof"
description = "Lean proof certificates for docs sites: versioned record (theorem, source hash, toolchain, kernel result) with a verifier that flags stale sources or toolchains. Zero Lean linkage. docs-core extension program (SPEC.md REQ-P)"
readme = "README.md"
keywords = ["lean", "proof", "certificate", "documentation", "verification"]
categories = ["development-tools", "authentication"]
exclude = [".github/", "supply-chain/"]

# Layer model: docs/layers.md in WyattAu/engineering-standards.
# L0 - leaf: zero estate-internal dependencies, and (REQ-P1) zero Lean
# linkage, ever: Lean runs out-of-process in the compiler; this crate
# only describes and checks the certificate record.
[package.metadata.layers]
tier = "L0"

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
serde_json = "1"

[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

# Content discipline: a certificate claims a fact about a source file; the
# verifier is total and every mismatch is a typed error, never a panic.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
